name: release
# Tag a version (v*) → build the Android APK and validate the repo as a
# `pi install git:` package; publish a GitHub Release with the APK.
# The extension itself updates via git (`pi update --extension git:github.com/<owner>/pppi`),
# so the extension job is the gate that keeps that channel green.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      PPPI_KEYSTORE_FILE: ${{ github.workspace }}/pppi.keystore.jks
      PPPI_KEYSTORE_PASSWORD: ${{ secrets.PPPI_KEYSTORE_PASSWORD }}
      PPPI_KEY_ALIAS: ${{ secrets.PPPI_KEY_ALIAS }}
      PPPI_KEY_PASSWORD: ${{ secrets.PPPI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: prepare keystore (falls back to debug signing without secrets)
        env:
          B64: ${{ secrets.PPPI_KEYSTORE_B64 }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$PPPI_KEYSTORE_FILE"
          else
            echo "no PPPI_KEYSTORE_B64 secret — debug-signed APK"
            echo "PPPI_KEYSTORE_FILE=" >> "$GITHUB_ENV"
          fi

      - name: build release APK
        run: cd apps/android && ./gradlew :app:assembleRelease --no-daemon

      - name: rename artifact
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk "dist/pppi-${GITHUB_REF_NAME}.apk"

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk

  # Validate the repo as a pi git package: `pi install git:github.com/<owner>/pppi`
  # clones the tag and runs `npm install --omit=dev` at the root, then loads
  # packages/pi-ext/src/index.ts through jiti. This job replays exactly that
  # with stock npm + node — a regression here breaks every `pi update --extension`.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: test suite (bun workspaces)
        run: |
          bun install --frozen-lockfile
          bun run test

      - name: simulate the pi git install (npm, --omit=dev)
        run: |
          # a clean copy: pi clones fresh, so the bun-installed node_modules
          # must not mask what stock npm would build
          rm -rf /tmp/pi-pkg && cp -r "$GITHUB_WORKSPACE" /tmp/pi-pkg
          rm -rf /tmp/pi-pkg/node_modules /tmp/pi-pkg/packages/*/node_modules /tmp/pi-pkg/apps/*/node_modules
          cd /tmp/pi-pkg && npm install --omit=dev --no-audit --no-fund
          npm install --omit=dev --no-save --no-audit --no-fund jiti

      - name: pi package smoke — manifest, entry load, voice-child resolution
        run: |
          cd /tmp/pi-pkg
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (!pkg.pi?.extensions?.length) throw new Error("no pi.extensions manifest");
            console.log("pi manifest ok:", pkg.pi.extensions.join(", "));
          '
          node --input-type=module -e '
            import { createRequire } from "node:module";
            const entry = createRequire(process.cwd() + "/packages/pi-ext/src/omni-host.ts")
              .resolve("@pppi/gateway/src/audio-service.ts");
            console.log("audio-service resolves:", entry);
          '
          node --input-type=module -e '
            const { createJiti } = await import("jiti");
            const jiti = createJiti(process.cwd() + "/packages/pi-ext/src/index.ts");
            const mod = await jiti.import(process.cwd() + "/packages/pi-ext/src/index.ts");
            if (typeof mod.default !== "function") throw new Error("extension default export missing");
            console.log("extension loads under jiti (npm --omit=dev tree)");
          '
